<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Savura EDU — Türkiye'de okuma fırsatı</title>
    <meta name="description" content="Savura EDU ile Türkiye'nin önde gelen üniversitelerine kabul. Belge hazırlığı, başvuru ve ortaklık programı." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B8A8C" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS (Safari → Bosh ekranga qo'shish) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Savura EDU" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body { background: #FBFCF9; -webkit-tap-highlight-color: transparent; }
      html[data-theme="dark"] body { background: #0B1312; }
    </style>
    <script>
      // tema sahifa chizilishidan oldin qo'yiladi (oq "yaltirash" bo'lmasligi uchun)
      try { var th = localStorage.getItem("savura:theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
